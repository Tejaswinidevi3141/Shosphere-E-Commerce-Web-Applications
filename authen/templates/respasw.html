{% extends 'main.html' %}

{% block content %}
<center>
    <h1>Reset your Password</h1>
    {% if messages %}
        {% for i in messages %}
            <h3>{{i}}</h3>
        {% endfor %}
    {% endif %}
        <form action="" method="POST">
            {% csrf_token %}
            <label for="">User Name:</label>
            <input type="text" name="uname" value="{{request.user.username}}" disabled> <br><br>
            {% if new %}

            <label for="">New Password:</label>
            <input type="text" name="npasw"> <br><br>

            <label for="">Confirm New Password:</label>
            <input type="text" name="c_pasw"> <br><br>
            
            {% else %}
            <label for="">Old Password:</label>
            <input type="text" name="opasw"> <br><br>

            {% endif %}

            <button type="submit">
                Reset
            </button>
        </form>
</center>
{% endblock %}
