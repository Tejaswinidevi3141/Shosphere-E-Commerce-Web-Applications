{% extends 'main.html' %}

{% block content %}
<center>
    <h1>update Your profile </h1>
      <img src="{{profile.profile.url}}" alt="" style="height: 200px;width: 200px">
        <form action="" method="POST" encrypt="multipart/form-data">
        {% csrf_token %}
        <label for="">First Name</label>
        <input type="text" name="fname" value="{{request.user.first_name}}"> <br><br>

        <label for="">Last Name</label>
        <input type="text" name="lname" value="{{request.user.last_name}}"> <br><br>

        <label for="">Email</label>
        <input type="email" name="email" value="{{request.user.email}}"> <br><br>

        <label for="">User Name</label>
        <input type="text" name="uname" value="{{request.user.username}}"> <br><br>

        <button type="submit">Update</button>
    </form>
</center>
{% endblock %}
